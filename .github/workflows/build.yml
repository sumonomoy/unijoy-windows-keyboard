name: Build & Release Windows Executables

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build executables
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\build.ps1

      - name: Run automated self-test
        shell: pwsh
        run: |
          .\UnijoyKeyboard.exe --self-test | Out-Host
          if ($LASTEXITCODE -ne 0) {
            throw "Self-test failed with exit code $LASTEXITCODE"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: UnijoyKeyboard-Windows-x64
          path: |
            UnijoyKeyboard.exe
            UnijoyKeyboardSetup.exe
            Unijoy.avrolayout

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag UnijoyKeyboard.exe UnijoyKeyboardSetup.exe Unijoy.avrolayout --clobber
          } else {
            gh release create $tag UnijoyKeyboard.exe UnijoyKeyboardSetup.exe Unijoy.avrolayout --title "Unijoy Keyboard $tag" --generate-notes
          }
