name: Build & Release Windows Executables

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build executables
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\build.ps1

      - name: Run automated self-test
        shell: pwsh
        run: |
          .\UnijoyKeyboard.exe --self-test | Out-Host
          if ($LASTEXITCODE -ne 0) {
            throw "Self-test failed with exit code $LASTEXITCODE"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UnijoyKeyboard-Windows-x64
          path: |
            UnijoyKeyboard.exe
            UnijoyKeyboardSetup.exe
            Unijoy.avrolayout

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            UnijoyKeyboard.exe
            UnijoyKeyboardSetup.exe
            Unijoy.avrolayout
          generate_release_notes: true
